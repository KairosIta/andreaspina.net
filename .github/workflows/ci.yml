name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuovo sullo stesso branch annulla la run precedente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Installa le dipendenze
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Formattazione
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  docker:
    name: Build immagine Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Stessa immagine che andra' in produzione: se si rompe
      # qui, ce ne accorgiamo prima del deploy e non dopo.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: andreaspina-net:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avvia il container e verifica che risponda
        run: |
          docker run -d --name site -p 3000:3000 andreaspina-net:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/it > /dev/null; then
              echo "Il sito risponde."
              exit 0
            fi
            sleep 2
          done
          echo "Il container non ha risposto entro 60s."
          docker logs site
          exit 1
